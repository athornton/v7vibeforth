[project]
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
name = "v7"
description = "Upload/download tool for v7 Unix under simh"
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["unix", "v7", "retrocomputing"]
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Private :: Do Not Upload",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "rich",
    "structlog",
    "telnetlib3"
]
dynamic = ["version"]

[project.scripts]
v7 = "v7.v7:main"

[[project.authors]]
name = "Adam Thornton"
email = "athornton@gmail.com"

[[project.authors]]
name = "SLAC AI"
email = "ai@slac.stanford.edu"

[project.urls]
Source = "https://github.com/athornton/v7vibeforth"

[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2"]

[dependency-groups]
lint = [
    "prek",
    "ruff>=0.15",
    "uv"
]
nox = [
    "nox",
    "nox-uv"
]
typing = [
    "mypy>=1.19"
]
dev = [
    "nox",
    "nox-uv",
    "pytest",
    "pytest-asyncio"
]

[tool.black]
line-length = 79

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_defs = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "redundant-expr",
    "redundant-self",
    "truthy-iterable",
    "unused-awaitable",
]
ignore_missing_imports = true
local_partial_types = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
# The python_files setting is not for test detection (pytest will pick up any
# test files named *_test.py without this setting) but to enable special
# assert processing in any non-test supporting files under tests. We
# conventionally put test support functions under tests.support and may
# sometimes use assert in test fixtures in conftest.py, and pytest only
# enables magical assert processing (showing a full diff on assert failures
# with complex data structures rather than only the assert message) in files
# listed in python_files.
python_files = ["tests/*.py", "tests/*/*.py"]

# Use the generic Ruff configuration in ruff.toml and extend it with only
# project-specific settings.
[tool.ruff]
extend = "ruff-shared.toml"

[tool.ruff.lint.extend-per-file-ignores]
"*/noxfile.py" = [
    "INP001",  # subdirectory nox configuration isn't in a package
]
"tests/**" = [
    "BLE001",  # the standalone runner reports any test error, not just ours
    "E402",    # sys.path must be set up before importing v7
    "INP001",  # tests are run directly, not imported as a package
    "S108",    # /tmp paths live in the fixture's VIRTUAL filesystem, which
               # never touches the real one -- same reason src/v7/v7.py does
]
"src/v7/v7.py" = [
    "C901",     # There are indeed some complex methods.
    "PLR0912",  # Yes, the REPLs are big and messy.
    "PLR0915",
    "S108",     # It is a literal /tmp.  v7 is not fancy.
    "T201",     # We do in fact want to print() a few strings.
]

[tool.ruff.lint.isort]
known-first-party = [
    "i7",
    "tests",
]
known-third-party = ["alembic"]

[tool.scriv]
categories = [
    "Backwards-incompatible changes",
    "New features",
    "Bug fixes",
    "Other changes",
]
entry_title_template = "{{ version }} ({{ date.strftime('%Y-%m-%d') }})"
format = "md"
md_header_level = "2"
new_fragment_template = "file:changelog.d/_template.md.jinja"
skip_fragments = "_template.md.jinja"

[tool.setuptools_scm]

[tool.uv]
required-environments = [
    "sys_platform == 'manylinux' and platform_machine == 'x86_64'",
    "sys_platform == 'manylinux' and platform_machine == 'aarch64'",
]
