name: CI

env:
  # Current supported uv version.  The uv documentation recommends
  # pinning this. The version should match the version used in
  # .pre-commit-config.yaml and frozen in uv.lock. It is updated by make
  # update-deps.
  UV_VERSION: "0.11.32"

"on":
  merge_group: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run nox
        run: uv run --only-group=nox nox -s lint typing test

